<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Three days of policy workshops, professional training, and coalition-building at NLAS 2026.">
    <link rel="icon" type="image/png" href="assets/brand/globe-logo.png" />
    <link rel="canonical" href="https://nlas.cnliberalism.org/schedule.html">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nlas.cnliberalism.org/schedule.html">
    <meta property="og:title" content="Schedule | NLAS 2026">
    <meta property="og:description" content="Three days of policy workshops, professional training, and coalition-building at NLAS 2026.">
    <meta property="og:image" content="https://nlas.cnliberalism.org/assets/brand/nlascard.png">
    <meta property="og:site_name" content="NLAS 2026">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@cnliberalism">
    <meta name="twitter:title" content="Schedule | NLAS 2026">
    <meta name="twitter:description" content="Three days of policy workshops, professional training, and coalition-building at NLAS 2026.">
    <meta name="twitter:image" content="https://nlas.cnliberalism.org/assets/brand/nlascard.png">
    <link rel="stylesheet" href="https://use.typekit.net/atj6iwh.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="header-placeholder" data-current-page="schedule"></div>

    <header class="page-hero page-hero-sky">
        <div class="page-hero-content">
            <div class="eyebrow eyebrow-amber">&mdash; July 15&ndash;17, 2026 &mdash;</div>
            <h1 class="page-title">Schedule</h1>
        </div>
    </header>

    <main class="page-content">
        <section class="schedule-page-section">
            <div class="schedule-day-panels" id="schedule-day-panels"></div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Session Detail Modal -->
    <div class="schedule-modal" id="schedule-modal" hidden>
        <div class="schedule-modal-backdrop" data-modal-close></div>
        <div class="schedule-modal-card" role="dialog" aria-modal="true" aria-labelledby="schedule-modal-title">
            <button type="button" class="schedule-modal-close" data-modal-close aria-label="Close">&times;</button>
            <div class="schedule-modal-body">
                <span class="schedule-modal-type" id="schedule-modal-type"></span>
                <h3 class="schedule-modal-title" id="schedule-modal-title"></h3>
                <p class="schedule-modal-meta" id="schedule-modal-meta"></p>
                <div class="schedule-modal-rsvp" id="schedule-modal-rsvp" hidden>
                    <a class="btn btn-primary" id="schedule-modal-rsvp-link" target="_blank" rel="noopener"></a>
                </div>
                <div class="schedule-modal-calendar" id="schedule-modal-calendar" hidden>
                    <a class="schedule-modal-cal-link" id="schedule-modal-gcal" target="_blank" rel="noopener">+ Google Calendar</a>
                    <a class="schedule-modal-cal-link" id="schedule-modal-ics">+ Apple / Outlook (.ics)</a>
                </div>
                <p class="schedule-modal-description" id="schedule-modal-description"></p>
                <div class="schedule-modal-speakers" id="schedule-modal-speakers"></div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="schedule-data.js"></script>
    <script src="speakers.js"></script>
    <script src="components.js"></script>
    <script src="script.js"></script>
</body>
</html>
